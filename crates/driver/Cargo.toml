[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aetheryx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
ir = { path = "../ir" }
eval = { path = "../eval" }
pliron = "0.19.0"
rnix = "0.14.0"
miette = { version = "7.6.0", features = ["fancy"] }
